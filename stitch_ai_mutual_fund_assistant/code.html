<!-- STITCH_SHADER_START:ANIMATION_3 class="absolute inset-0 w-full h-full z-0 pointer-events-none opacity-40" -->
<div class="absolute inset-0 w-full h-full z-0 pointer-events-none opacity-40" style="display:block;">
<canvas id="shader-canvas-ANIMATION_3" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_3');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    
    // Deep slate and navy base
    vec3 color1 = vec3(0.02, 0.08, 0.14); // Deep Navy
    vec3 color2 = vec3(0.07, 0.11, 0.17); // Slate Blue
    vec3 color3 = vec3(0.0, 0.1, 0.2);     // Accent Glow
    
    float n = snoise(uv * 1.5 + u_time * 0.05);
    float n2 = snoise(uv * 2.5 - u_time * 0.08);
    
    vec3 mixedColor = mix(color1, color2, n * 0.5 + 0.5);
    mixedColor = mix(mixedColor, color3, n2 * 0.3);
    
    // Subtle vignette
    float vignette = 1.0 - smoothstep(0.5, 1.5, length(uv - 0.5));
    
    gl_FragColor = vec4(mixedColor * vignette, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<textarea class="w-full bg-transparent border-none text-on-surface font-body-md focus:ring-0 resize-none py-3 px-4 max-h-32 placeholder-on-surface-variant/50" id="chat-input" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" onkeydown="if(event.key === 'Enter' &amp;&amp; !event.shiftKey) { event.preventDefault(); submitUserMessage(); }" placeholder="Ask about HDFC Mutual Funds..." rows="1"></textarea>
<button class="bg-primary text-on-primary rounded-xl p-3 ml-2 flex-shrink-0 hover:bg-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed mb-1 mr-1" id="send-btn" onclick="submitUserMessage()">

<script>
        const chatFeed = document.getElementById('chat-feed');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const emptyState = document.getElementById('empty-state');

        function submitPrompt(text) {
            chatInput.value = text;
            chatInput.style.height = 'auto';
            submitUserMessage();
        }

        async function submitUserMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Hide empty state
            if (emptyState) emptyState.style.display = 'none';

            // Add User Message
            appendMessage('user', message);
            
            // Clear input & disable
            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatInput.disabled = true;
            sendBtn.disabled = true;

            // Add Loading Bubble
            const loadingId = appendLoading();

            try {
                // Mock API Call
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Mock Response based on simple keyword matching for demonstration
                let responseText = "";
                if(message.toLowerCase().includes("expense ratio") && message.toLowerCase().includes("large cap")) {
                    responseText = "The **HDFC Large Cap Fund** (Direct Plan) currently has an expense ratio of approximately **0.85%**. \n\n*Please verify with the latest scheme information document as expense ratios are subject to periodic changes.*";
                } else if (message.toLowerCase().includes("exit load") && message.toLowerCase().includes("elss")) {
                    responseText = "**HDFC ELSS Tax Saver Fund** has a mandatory lock-in period of 3 years from the date of allotment.\n\nSince redemption is not permitted during this lock-in period, there is **Nil exit load** applicable on this fund.";
                } else {
                    responseText = "I am a factual assistant. Based on available scheme documents, I can provide details on expense ratios, exit loads, minimum investments, and basic comparisons.\n\n*Note: Ensure you review the official SID for the most current data.*";
                }

                removeMessage(loadingId);
                appendMessage('ai', responseText);

            } catch (error) {
                removeMessage(loadingId);
                appendMessage('ai', "I encountered an error retrieving that information. Please try again.");
            } finally {
                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full fade-in-up ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            let contentHtml = '';
            
            if (role === 'ai') {
                // Very basic markdown parser for demo
                let formattedText = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n\n/g, '</p><p>')
                    .replace(/\n\* /g, '<ul><li>')
                    .replace(/\n/g, '<br>');
                
                if (formattedText.includes('<ul><li>')) formattedText += '</li></ul>';

                contentHtml = `
                    <div class="flex max-w-[85%] items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center flex-shrink-0 border border-primary/30 mt-1">
                            <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
                        </div>
                        <div class="glass-bubble-ai rounded-2xl rounded-tl-sm p-4 text-on-surface prose font-body-md shadow-sm">
                            <p>${formattedText}</p>
                        </div>
                    </div>
                `;
            } else {
                contentHtml = `
                    <div class="glass-bubble-user rounded-2xl rounded-tr-sm p-4 max-w-[80%] text-on-surface font-body-md shadow-sm">
                        ${text}
                    </div>
                `;
            }

            msgDiv.innerHTML = contentHtml;
            chatFeed.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = `flex w-full fade-in-up justify-start`;
            
            msgDiv.innerHTML = `
                <div class="flex max-w-[85%] items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center flex-shrink-0 border border-primary/30 mt-1">
                        <span class="material-symbols-outlined text-primary text-sm">smart_toy</span>
                    </div>
                    <div class="glass-bubble-ai rounded-2xl rounded-tl-sm p-4 py-5 flex items-center shadow-sm">
                        <div class="dot-typing">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            
            chatFeed.appendChild(msgDiv);
            scrollToBottom();
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }
    </script>
