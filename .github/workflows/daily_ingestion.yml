name: Daily Data Ingestion

on:
  schedule:
    # Runs at 10:00 AM IST (4:30 AM UTC) every day
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ingest_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Ensure this matches your project requirements
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run Scraping Script
        run: python scripts/scrape.py

      - name: Run Data Cleaning Script
        run: python scripts/clean.py

      - name: Run Chunking & Embedding Script
        # We need the GROQ_API_KEY if chunk_and_embed uses any Groq models, 
        # or just general env vars if needed. It mostly uses HuggingFace local models.
        # But just in case, we pass secrets if they are required.
        run: python scripts/chunk_and_embed.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ vectorstore/
          # Only commit if there are changes to avoid workflow failure
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily data ingestion update" && git push)
